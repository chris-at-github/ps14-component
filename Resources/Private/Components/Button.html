<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:fo="http://typo3.org/ns/Ps14/Foundation/ViewHelpers"
    xmlns:co="http://typo3.org/ns/Ps14/Component/Components/ComponentCollection"
    data-namespace-typo3-fluid="true">
    <f:comment>
    <!--
        Dokumentation: Fluid-Komponente <co:button>

        Parameter für <co:button>:
        - variant: (string) z.B. "default", "primary" – bestimmt die Button-Variante/Klasse
        - disabled: (bool|string) true/false – deaktiviert den Button
        - prefixIcon: (string, optional) Voller EXT-Pfad zur SVG-Datei, z. B. "EXT:ps14_site/Resources/Private/Assets/Svg/Embed/check.svg"; Icon vor dem Button-Text, eingebettet über fo:svg.inline.
        - suffixIcon: (string, optional) Voller EXT-Pfad zur SVG-Datei, z. B. "EXT:ps14_site/Resources/Private/Assets/Svg/Embed/check.svg"; Icon nach dem Button-Text, eingebettet über fo:svg.inline.
        - type: (string, optional) HTML-Attribut type des Buttons, z.B. "button", "submit", "reset" – Standard: "button"
        - id: (string) optionale ID für den Button
        - class: (string) optionale zusätzliche CSS-Klassen für den Button
        - url: (string, optional) URL – wird als <f:link.typolink> gerendert statt als <button>. Unterstützt TYPO3-Link-Syntax (z.B. t3://page?uid=1).
        - label: (string, optional) Setzt ein aria-label auf das Button-/Link-Element, um den zugänglichen Namen zu ergänzen bzw. zu überschreiben (z.B. bei generischem Button-Text wie "Weiterlesen"). Wird nur gerendert, wenn ein Wert übergeben wird – sonst bleibt der sichtbare Slot-Text der zugängliche Name.

        Beispielhafte Aufrufe:
        <co:button>Button</co:button>
        <co:button variant="default" disabled="true">Button Disabled</co:button>
        <co:button variant="default" prefixIcon="EXT:ps14_site/Resources/Private/Assets/Svg/Embed/star-fill.svg">Button Star Prefix</co:button>
        <co:button.icon variant="primary" icon="EXT:ps14_site/Resources/Private/Assets/Svg/Embed/star-fill.svg" label="Button Star" />
        <co:button variant="primary" url="t3://page?uid=1">Zur Startseite</co:button>
        <co:button variant="primary" url="https://example.com" label="Weitere Informationen zur Veranstaltung, öffnet in neuem Tab">Weitere Informationen</co:button>
    -->
    </f:comment>

    <f:argument name="variant" type="string" optional="{true}" />
    <f:argument name="type" type="string" optional="{true}" default="button" />
    <f:argument name="class" type="string" optional="{true}" />
    <f:argument name="id" type="string" optional="{true}" />
    <f:argument name="prefixIcon" type="string" optional="{true}" />
    <f:argument name="suffixIcon" type="string" optional="{true}" />
    <f:argument name="disabled" type="boolean" optional="{true}" />
    <f:argument name="url" type="string" optional="{true}" />
    <f:argument name="label" type="string" optional="{true}" />

    <fo:cssClass value="button--{variant}" condition="{variant}" />
    <fo:cssClass value="button--icon-prefix" condition="{prefixIcon}" />
    <fo:cssClass value="button--icon-suffix" condition="{suffixIcon}" />
    <fo:cssClass value="button--disabled" condition="{disabled}" />

    <f:section name="Content">
        <f:if condition="{prefixIcon}"><fo:svg.inline source="{prefixIcon}" class="button__icon"/></f:if>
        <f:slot />
        <f:if condition="{suffixIcon}"><fo:svg.inline source="{suffixIcon}" class="button__icon"/></f:if>
    </f:section>

    <f:if condition="{url}">
        <f:then>
            <f:link.typolink parameter="{url}" additionalAttributes="{id: id, 'aria-label': label}" class="button {class}">
                <f:render section="Content" arguments="{_all}" />
            </f:link.typolink>
        </f:then>
        <f:else>
            <button id="{id}" type="{type}" class="button {class}" aria-label="{label}" {f:if(condition: disabled, then: 'disabled="disabled"')}>
                <f:render section="Content" arguments="{_all}" />
            </button>
        </f:else>
    </f:if>
</html>
