<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:fo="http://typo3.org/ns/Ps14/Foundation/ViewHelpers" xmlns:co="http://typo3.org/ns/Ps14/Component/Components/ComponentCollection"
    data-namespace-typo3-fluid="true">
    <f:comment>
        <!--
            Dokumentation: Fluid-Komponente <co:form.radio.group>

            Beschreibung:
            Rendert eine Gruppe von Radio-Buttons innerhalb eines <fieldset> mit gemeinsamem
            Label (<legend>), optionaler Beschreibung und Fehlerausgabe im standardisierten
            Form-Markup (BEM: form-item-group, form-item-group__choices, form-field,
            form-field--radio, form-item, form-item--choice, form-item--radio). Es ist
            immer nur eine Option auswählbar.

            Verhalten:
            - Wird keine `id` übergeben, wird automatisch eine eindeutige Basis-ID generiert
                (`form-field--{random}`). Pro Option wird `{id}-{index}` als Input-ID verwendet
                und über `<co:form.label>` per `for`-Attribut verknüpft.
            - Ist `disabled=false` (Standard), wird zusätzlich ein verstecktes Feld mit leerem
                Wert (`<input type="hidden" name="{name}" value="">`) ausgegeben, damit der
                Feldname auch bei nicht ausgewählter Option im Request enthalten ist.
            - Die Option, deren `value` mit dem Parameter `value` übereinstimmt, wird als
                `checked` markiert.
            - `required` wird nur auf den ersten Radio-Input gesetzt; das genügt, damit der
                Browser die Gruppe als Pflichtfeld erkennt. Im Legend erscheint zusätzlich
                ein lokalisierter Pflichtfeld-Hinweis.
            - Werden `errors` übergeben, erhalten die Inputs den Modifier `form-field--error`
                und die Fehlermeldungen werden über `<co:form.error>` ausgegeben.
            - `variant` setzt die Modifier `form-item-group--{variant}` und
                `form-item-group__choices--{variant}` (z.B. `horizontal`).
            - `disabled` setzt den Modifier `form-item-group--disabled` am Fieldset und
                deaktiviert alle Inputs.

            Parameter:
            - id (string, optional): Basis-ID. Wird automatisch generiert, falls leer.
            - name (string, Pflicht): Name des Feldes (Request-Key, identisch für alle Optionen).
            - label (string, Pflicht): Gruppen-Label (<legend>).
            - description (string, optional): Beschreibungstext unterhalb des Labels.
            - options (array, Pflicht): Array mit Optionen je {value, label}.
            - value (mixed, optional): Aktuell ausgewählter Wert.
            - errors (string[], optional): Fehlermeldungen, aktiviert Fehler-Styling.
            - disabled (boolean, optional): Deaktiviert die gesamte Gruppe.
            - required (boolean, optional): Markiert die Gruppe als Pflichtfeld.
            - variant (string, optional): Optische Variante, z.B. "horizontal".

            Vollständige Dokumentation: ./Documentation/Form.Radio.Group.md

            Beispielhafte Aufrufe:
            <co:form.radio.group
                name="membership-group"
                label="Mitgliedschaft wählen"
                description="Wähle 12 Monate um das beste Preis-Leistungsverhältnis zu erhalten."
                options="{
                    0: {value: '1', label: '1 Monat'},
                    1: {value: '3', label: '3 Monate'},
                    2: {value: '12', label: '12 Monate'}
                }"
                value="3"
                required="true"
                errors="{
                    0: 'Bitte wähle mindestens eine Mitgliedschaft aus.'
                }"
                variant="horizontal"
            />
        -->
    </f:comment>

    <f:argument name="id" type="string" default="" />
    <f:argument name="name" type="string" />
    <f:argument name="label" type="string" />
    <f:argument name="description" type="string" optional="{true}" />
    <f:argument name="options" type="array" />
    <f:argument name="value" type="mixed" optional="{true}" default="" />
    <f:argument name="errors" type="string[]" optional="{true}" />
    <f:argument name="disabled" type="boolean" optional="{true}" />
    <f:argument name="required" type="boolean" optional="{true}" />
    <f:argument name="variant" type="string" optional="{true}" />

    <f:if condition="{id} == ''">
        <f:variable name="id">form-field--{fo:randomId()}</f:variable>
    </f:if>

    <fo:cssClass name="fieldClass" value="form-field form-field--radio" />
    <fo:cssClass name="fieldClass" value="form-field--error" condition="{errors}" />

    <co:form.group.choice
        label="{label}"
        description="{description}"
        errors="{errors}"
        disabled="{disabled}"
        required="{required}"
        variant="{variant}"
    >
        <f:for each="{options}" as="option" iteration="iteration">
            <div class="form-item form-item--choice form-item--radio">
                <input
                    type="radio"
                    id="{id}-{iteration.index}"
                    name="{name}"
                    class="{fieldClass}"
                    value="{option.value}"
                    checked="{f:if(condition: '{value} == {option.value}', then: 'checked')}"
                    disabled="{f:if(condition: '{disabled}', then: 'disabled')}"
                    required="{f:if(condition: '{required} && {iteration.index} == 0', then: 'required')}" />
                <co:form.label id="{id}-{iteration.index}" label="{option.label}" />
            </div>
        </f:for>
    </co:form.group.choice>
</html>
