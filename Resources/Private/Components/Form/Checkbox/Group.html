<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:fo="http://typo3.org/ns/Ps14/Foundation/ViewHelpers" xmlns:co="http://typo3.org/ns/Ps14/Component/Components/ComponentCollection"
    data-namespace-typo3-fluid="true">
    <f:comment>
        <!--
            Dokumentation: Fluid-Komponente <co:form.checkbox.group>

            Rendert eine Gruppe von Checkbox-Optionen innerhalb eines <fieldset> mit gemeinsamer Beschriftung,
            optionaler Beschreibung und Fehlerausgabe. Mehrfachauswahl ist möglich.

            Parameter:
            - id: (string, optional) Basis-ID für die Checkbox-Inputs – wird automatisch generiert, falls leer. Pro Option wird "{id}-{index}" verwendet.
            - name: (string) Name des Feldes (wird als "{name}[]" am Input gesetzt)
            - label: (string) Gruppen-Label (Legend)
            - description: (string, optional) Beschreibungstext unter dem Label
            - options: (array) Array mit Optionen, je {value, label}
            - values: (array, optional) Aktuell ausgewählte Werte (mehrere möglich)
            - errors: (string[], optional) Fehler-Meldungen für das Feld
            - disabled: (boolean, optional) Gesamte Gruppe deaktivieren
            - required: (boolean, optional) Feld als Pflichtfeld markieren (das required-Attribut wird auf der ersten Checkbox gesetzt)
            - variant: (string, optional) Optische Variante der Gruppe, z.B. "horizontal" für nebeneinander angeordnete Optionen

            Beispielhafte Aufrufe:
            <co:form.checkbox.group
                name="interests"
                label="Interessen wählen"
                description="Mehrfachauswahl möglich."
                options="{
                    0: {value: 'sport', label: 'Sport'},
                    1: {value: 'musik', label: 'Musik'},
                    2: {value: 'kunst', label: 'Kunst'}
                }"
                values="{0: 'musik', 1: 'kunst'}"
                required="true"
                errors="{
                    0: 'Bitte wähle mindestens ein Interesse aus.'
                }"
                variant="horizontal"
            />
        -->
    </f:comment>

    <f:argument name="id" type="string" default="" />
    <f:argument name="name" type="string" />
    <f:argument name="label" type="string" />
    <f:argument name="description" type="string" optional="{true}" />
    <f:argument name="options" type="array" />
    <f:argument name="values" type="array" optional="{true}" />
    <f:argument name="errors" type="string[]" optional="{true}" />
    <f:argument name="disabled" type="boolean" optional="{true}" />
    <f:argument name="required" type="boolean" optional="{true}" />
    <f:argument name="variant" type="string" optional="{true}" />

    <f:if condition="{id} == ''">
        <f:variable name="id">form-field--{fo:randomId()}</f:variable>
    </f:if>

    <fo:cssClass name="fieldClass" value="form-field form-field--checkbox" />
    <fo:cssClass name="fieldClass" value="form-field--error" condition="{errors}" />

    <co:form.group.choice
        label="{label}"
        description="{description}"
        errors="{errors}"
        disabled="{disabled}"
        required="{required}"
        variant="{variant}"
    >
        <f:if condition="{disabled} == false">
            <input type="hidden" name="{name}" value="" />
        </f:if>

        <f:for each="{options}" as="option" iteration="iteration">
            <div class="form-item form-item--choice form-item--checkbox">
                <input
                    type="checkbox"
                    id="{id}-{iteration.index}"
                    name="{name}[]"
                    class="{fieldClass}"
                    value="{option.value}"
                    checked="{f:if(condition: '{values -> fo:iterable.contains(value: option.value)}', then: 'checked')}"
                    disabled="{f:if(condition: '{disabled}', then: 'disabled')}"
                    required="{f:if(condition: '{required} && {iteration.index} == 0', then: 'required')}" />
                <co:form.label id="{id}-{iteration.index}" label="{option.label}" />
            </div>
        </f:for>
    </co:form.group.choice>
</html>
