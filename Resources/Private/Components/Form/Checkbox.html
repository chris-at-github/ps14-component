<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:co="http://typo3.org/ns/Ps14/Component/Components/ComponentCollection"
    data-namespace-typo3-fluid="true">
    <f:comment>
    <!--
        Dokumentation: Fluid-Komponente <co:form.checkbox>

        Beschreibung:
        Rendert eine einzelne Checkbox mit zugehörigem Label und optionaler Fehlerausgabe
        im standardisierten Form-Markup (BEM: form-field, form-field--checkbox, form-item,
        form-item--choice, form-item--checkbox). Der Label-Inhalt darf HTML enthalten,
        z.B. Links für Datenschutz- oder AGB-Zustimmungen.

        Verhalten:
        - Wird keine `id` übergeben, wird automatisch eine eindeutige ID generiert
            (`form-field--{random}`), damit das Label per `for`-Attribut korrekt mit dem
            Input verknüpft werden kann.
        - Ist `hiddenValueField=true` (Standard), wird zusätzlich ein verstecktes Feld
            mit leerem Wert ausgegeben. Dadurch enthält der Request den Feldnamen auch
            dann, wenn die Checkbox nicht aktiviert wurde (wichtig für Single-Checkboxen
            in Formularen).
        - `required` wird sowohl am Input als auch am Label gesetzt, damit das
            Pflichtfeld semantisch und visuell erkennbar ist.
        - Werden `errors` übergeben, erhält der Block den Modifier `form-field--error`
            und die Fehlermeldungen werden über `<co:form.error>` ausgegeben.

        Parameter:
        - id (string, optional): ID des Inputs. Wird automatisch generiert, falls leer.
        - name (string, Pflicht): Name des Feldes (request key).
        - label (string, Pflicht): Label-Text – HTML ist erlaubt (z.B. Inline-Links).
        - value (string, optional, Standard "1"): Wert, der bei aktiver Checkbox gesendet wird.
        - checked (boolean, optional): Vorbelegung als aktiviert.
        - required (boolean, optional): Markiert das Feld als Pflichtfeld.
        - class (string, optional): Zusätzliche CSS-Klassen am Input.
        - errors (string[], optional): Fehlermeldungen, aktiviert Fehler-Styling.
        - hiddenValueField (boolean, Standard true): Verstecktes Feld für leeren Wert.
        - disabled (boolean, optional, Standard false): Deaktiviert die Checkbox.

        Vollständige Dokumentation: ./Documentation/Form.Checkbox.md

        Beispielhafte Aufrufe:
        <co:form.checkbox id="form-field--7erhk1" name="checkbox" label="Hiermit akzeptiere ich die <a href='#' class='link link--default'>Nutzungsbedingungen</a>" checked="true" />
        <co:form.checkbox name="agb" label="AGB akzeptieren" required="true" />
        <co:form.checkbox name="newsletter" label="Newsletter abonnieren" hiddenValueField="false" disabled="true" />
    -->
    </f:comment>

    <f:argument name="id" type="string" default="" />
    <f:argument name="name" type="string" />
    <f:argument name="label" type="string" />
    <f:argument name="value" type="string" default="1" />
    <f:argument name="checked" type="boolean" optional="{true}" />
    <f:argument name="required" type="boolean" optional="{true}" />
    <f:argument name="class" type="string" optional="{true}" />
    <f:argument name="errors" type="string[]" optional="{true}" />
    <f:argument name="hiddenValueField" type="boolean" default="true" />
    <f:argument name="disabled" type="boolean" optional="{true}" />
    <f:argument name="attributes" type="array" optional="{true}" default="{}" />

    <co:form.item.choice
        label="{label}"
        required="{required}"
        description="{description}"
        errors="{errors}"
        type="checkbox"
    >
        <f:if condition="{hiddenValueField}">
            <input type="hidden" name="{name}" value="" />
        </f:if>
        <input
            type="checkbox"
            id="{id}"
            name="{name}"
            class="{fieldClass}"
            value="{value}"
            {f:if(condition: checked, then: 'checked')}
            {f:if(condition: disabled, then: 'disabled')}
            {f:if(condition: required, then: 'required')}
            <f:for each="{attributes}" as="attrValue" key="attrName"> {attrName}="{attrValue}"</f:for>
        />
    </co:form.item.choice>
</html>
